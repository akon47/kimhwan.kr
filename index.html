<!DOCTYPE html>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- Apply the saved (or system) theme before first paint. Keep in sync with src/composables/useTheme.ts. -->
  <script>
    (function () {
      var theme;
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'dark-theme') theme = 'dark';
        else if (saved === 'light' || saved === 'light-theme') theme = 'light';
      } catch (e) { /* storage blocked: fall through to the system setting */ }
      if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
